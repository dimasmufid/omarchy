name: Desktop

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --workspace --locked
      - run: cargo build --release --package omarchy-linkd --locked
      - run: bash -n packaging/install-local.sh
